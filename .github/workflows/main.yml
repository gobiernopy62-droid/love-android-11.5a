name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: # Permite ejecutar el flujo manualmente si lo necesitas

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Setup NDK para libwebp
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d

    - name: Clonar y Compilar libwebp (.so)
      run: |
        echo "=== Clonando libwebp ==="
        git clone --branch v1.4.0 --depth 1 https://github.com/webmproject/libwebp.git libwebp-src
        
        for ABI in arm64-v8a armeabi-v7a; do
          echo "🔨 Compilando libwebp para $ABI..."
          mkdir -p libwebp-src/build-$ABI
          cd libwebp-src/build-$ABI
          
          cmake .. \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DBUILD_SHARED_LIBS=ON \
            -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_EXTRAS=OFF
            
          cmake --build . -j4
          cd ../..
          
          # Copiar los .so a la carpeta jniLibs para que Gradle los incluya automáticamente
          DEST_DIR="app/src/main/jniLibs/$ABI"
          mkdir -p "$DEST_DIR"
          find libwebp-src/build-$ABI -name "*.so" -exec cp {} "$DEST_DIR/" \;
        done
        rm -rf libwebp-src

    - name: Force download LÖVE core engine
      run: |
        git submodule sync || true
        git submodule update --init --recursive --force || true
        
        if [ ! -f "love/src/jni/love/src/common/config.h" ]; then
          echo "⚠️ El motor no se descargó por Git. Forzando clonado manual de LÖVE 11.5..."
          rm -rf love/src/jni/love
          git clone --branch 11.5 --depth 1 https://github.com/love2d/love.git love/src/jni/love
        fi

    - name: Inject Prebuilt LuaJIT Binaries via Direct Download
      run: |
        echo "=== Verificando binarios estáticos de LuaJIT ==="
        for ARCH in arm64-v8a armeabi-v7a x86 x86_64; do
          PATH_A="love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"
          mkdir -p "love/src/jni/LuaJIT-2.1/android/$ARCH"
          
          echo "📥 Descargando libluajit.a para $ARCH..."
          if ! curl -L --fail -s -o "$PATH_A" "https://github.com/love2d/love-android/raw/11.5/love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"; then
            echo "⚠️ No se encontró en la rama 11.5, intentando con la rama master..."
            if ! curl -L --fail -s -o "$PATH_A" "https://github.com/love2d/love-android/raw/master/love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"; then
              echo "⚠️ Reintentando desde rama main..."
              curl -L --fail -s -o "$PATH_A" "https://github.com/love2d/love-android/raw/main/love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"
            fi
          fi
          
          if grep -q "<!DOCTYPE html>" "$PATH_A" 2>/dev/null; then
            echo "❌ Error crítico: Se filtró una página HTML en $ARCH. Borrando archivo corrupto..."
            rm -f "$PATH_A"
          fi
        done
        echo "✅ Verificación de binarios completada."

    - name: Fix Windows line endings (CRLF to LF) and set permissions
      run: |
        find . -type f \( -name "*.sh" -o -name "*.mk" -o -name "Android.mk" -o -name "Application.mk" \) -exec sed -i 's/\r$//' {} \;
        find . -name "*.sh" -type f -exec chmod +x {} \;

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        distribution: adopt-hotspot
        java-version: 17
        cache: gradle

    - name: Build con Gradle
      run: bash ./gradlew assembleNormalRecord assembleEmbedRelease bundleNormalNoRecordRelease bundleEmbedRecordRelease bundleEmbedNoRecordRelease --info --stacktrace

    - name: Firmar APK Embed Release
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        echo "=== Preparando Firma de APK ==="
        
        # Búsqueda dinámica del APK no firmado generado
        UNSIGNED_APK=$(find app/build/outputs/apk/ -type f -name "*unsigned.apk" | head -n 1)
        
        if [ -z "$UNSIGNED_APK" ]; then
          echo "❌ Error: No se encontró ningún APK no firmado."
          echo "Estructura de archivos en app/build/outputs/apk/:"
          ls -R app/build/outputs/apk/ || true
          exit 1
        fi
        
        echo "✅ APK encontrado en: $UNSIGNED_APK"

        # Decodificación ultra segura limpiando saltos de línea
        echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > mikey.jks

        # Validar que el archivo no esté vacío
        if [ ! -s mikey.jks ]; then
          echo "❌ Error: El archivo mikey.jks quedó vacío tras decodificar. Revisa el secret KEYSTORE_BASE64."
          exit 1
        fi

        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)
        ALIGNED_APK="app-aligned.apk"
        SIGNED_APK="PentagonMan-signed.apk"

        echo "⚡ Alineando APK con zipalign..."
        "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

        echo "✍️ Firmando APK con apksigner..."
        "$BUILD_TOOLS/apksigner" sign \
          --ks mikey.jks \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --out "$SIGNED_APK" \
          "$ALIGNED_APK"

        echo "🔍 Verificando firma..."
        "$BUILD_TOOLS/apksigner" verify "$SIGNED_APK"

        rm -f mikey.jks "$ALIGNED_APK"
        echo "🚀 Firma completada exitosamente!"

    # --- ARTEFACTOS ---

    - name: Artifact (Signed Release APK)
      uses: actions/upload-artifact@v4
      with:
        name: PentagonMan-signed.apk
        path: PentagonMan-signed.apk

    - name: Artifact (Normal debug APK)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-debug.apk
        path: app/build/outputs/apk/normalRecord/debug/app-normal-record-debug.apk

    - name: Artifact (Embed AAB w/o recording)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-embed.aab
        path: app/build/outputs/bundle/embedNoRecordRelease/app-embed-noRecord-release.aab