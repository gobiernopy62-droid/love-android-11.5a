name: build

on: [push, pull_request]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Force download LÖVE core engine
      run: |
        git submodule sync || true
        git submodule update --init --recursive --force || true
        
        if [ ! -f "love/src/jni/love/src/common/config.h" ]; then
          echo "⚠️ El motor no se descargó por Git. Forzando clonado manual de LÖVE 11.5..."
          rm -rf love/src/jni/love
          git clone --branch 11.5 --depth 1 https://github.com/love2d/love.git love/src/jni/love
        fi

    - name: Inject Prebuilt LuaJIT Binaries via Direct Download
      run: |
        echo "=== Verificando binarios estáticos de LuaJIT ==="
        for ARCH in arm64-v8a armeabi-v7a x86 x86_64; do
          PATH_A="love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"
          mkdir -p "love/src/jni/LuaJIT-2.1/android/$ARCH"
          
          echo "📥 Descargando libluajit.a para $ARCH..."
          # Usamos --fail para que curl devuelva error si encuentra un 404 en vez de guardar el HTML
          # Intentamos primero con la rama dedicada '11.5' del repositorio oficial
          if ! curl -L --fail -s -o "$PATH_A" "https://github.com/love2d/love-android/raw/11.5/love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"; then
            echo "⚠️ No se encontró en la rama 11.5, intentando con la rama master..."
            if ! curl -L --fail -s -o "$PATH_A" "https://github.com/love2d/love-android/raw/master/love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"; then
              echo "⚠️ Reintentando desde rama main..."
              curl -L --fail -s -o "$PATH_A" "https://github.com/love2d/love-android/raw/main/love/src/jni/LuaJIT-2.1/android/$ARCH/libluajit.a"
            fi
          fi
          
          # Control estricto: Si el archivo por algún motivo sigue conteniendo HTML, lo destruimos
          if grep -q "<!DOCTYPE html>" "$PATH_A" 2>/dev/null; then
            echo "❌ Error crítico: Se filtró una página HTML en $ARCH. Borrando archivo corrupto..."
            rm -f "$PATH_A"
          fi
        done
        echo "✅ Verificación de binarios completada."

    - name: Fix Windows line endings (CRLF to LF) and set permissions
      run: |
        find . -type f \( -name "*.sh" -o -name "*.mk" -o -name "Android.mk" -o -name "Application.mk" \) -exec sed -i 's/\r$//' {} \;
        find . -name "*.sh" -type f -exec chmod +x {} \;

    - name: "Debug: Check repository layout"
      run: |
        echo "=== Verificando que LuaJIT tenga sus archivos .a reales ==="
        find love/src/jni/LuaJIT-2.1/android/ -name "*.a" -exec ls -lh {} \; || echo "¡Alerta! No se encontraron los archivos .a"

    - name: Copy game.love to assets directories
      run: |
        echo "📦 Copiando game.love a los directorios de assets..."
        mkdir -p app/src/embed/assets
        mkdir -p app/src/normal/assets
        
        # Buscar game.love y copiarlo a ambos directorios
        if [ -f "app/src/embed/assets/game.love" ]; then
          echo "✅ game.love encontrado en app/src/embed/assets/"
          cp app/src/embed/assets/game.love app/src/normal/assets/game.love
          ls -lh app/src/embed/assets/game.love app/src/normal/assets/game.love
        else
          echo "❌ No se encontró game.love en app/src/embed/assets/"
          exit 1
        fi

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        distribution: adopt-hotspot
        java-version: 17
        cache: gradle

    - name: Build
      run: bash ./gradlew assembleNormalRecord assembleEmbedRelease bundleNormalNoRecordRelease bundleEmbedRecordRelease bundleEmbedNoRecordRelease --info --stacktrace

    - name: Artifact (Normal debug APK)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-debug.apk
        path: app/build/outputs/apk/normalRecord/debug/app-normal-record-debug.apk

    - name: Artifact (Normal unsigned APK)
      uses: actions/upload-artifact@v4
      with:
        name: love-android.apk
        path: app/build/outputs/apk/normalRecord/release/app-normal-record-release-unsigned.apk

    - name: Artifact (Normal AAB w/o recording)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-ps.aab
        path: app/build/outputs/bundle/normalNoRecordRelease/app-normal-noRecord-release.aab

    - name: Artifact (Embed AAB)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-embed-record.aab
        path: app/build/outputs/bundle/embedRecordRelease/app-embed-record-release.aab

    - name: Artifact (Embed AAB w/o recording)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-embed.aab
        path: app/build/outputs/bundle/embedNoRecordRelease/app-embed-noRecord-release.aab

    - name: Artifact (Embed APK w/o recording)
      uses: actions/upload-artifact@v4
      with:
        name: mi-juego-embed-release.apk
        path: app/build/outputs/apk/embedNoRecord/release/app-embed-noRecord-release-unsigned.apk

    - name: Artifact (Embed APK w/ recording)
      uses: actions/upload-artifact@v4
      with:
        name: mi-juego-embed-record-release.apk
        path: app/build/outputs/apk/embedRecord/release/app-embed-record-release-unsigned.apk

    - name: Artifact (Debug symbols)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-unstripped-debugsyms
        path: love/build/intermediates/library_jni